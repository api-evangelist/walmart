domain_standards:
- id: gs1-gtin
  standard: GS1 Global Trade Item Number (GTIN-14)
  conforms: true
  category: domain-standard
  market: retail / commerce
  evidence: 'Declared in the contract, not just in prose: `gtin` is a first-class item-identifier query parameter across 10
    of the 27 published OpenAPI definitions, and the spec text states "The global trade item number (GTIN) is a 14-digit number,
    including the check digit, that is used worldwide and identifies the Each. If the user''s number is less than 14 digits,
    add zeros at the beginning." — e.g. GET /v3/lagtime, the Lag Time v2.x feed which uses GTIN as the PRIMARY item identifier,
    and GET /v3/items/gtin-exemption/status.'
  spec_locations:
  - openapi/_original/walmart-dropship-vendor-lag-time-openapi-original.yml (parameter gtin)
  - openapi/_original/walmart-marketplace-lag-time-openapi-original.yml (parameter gtin)
  - openapi/_original/walmart-marketplace-items-openapi-original.yml (GTIN exemption status)
  note: A buyer who already speaks GS1 can map their catalogue onto Walmart with no bespoke identifier connector. Walmart
    also exposes a GTIN Exemption API (GET /v3/items/gtin-exemption/status, 100/min) for sellers whose products legitimately
    have no GS1 identifier — an unusually explicit acknowledgement of the standard's boundary.
- id: gs1-upc-ean-isbn
  standard: GS1 product identifier family (UPC, EAN, ISBN)
  conforms: true
  category: domain-standard
  market: retail / commerce
  evidence: upc appears in 7 spec files, ean in 22, isbn in 4. The August 20 2026 release added optional `ean` and `isbn`
    query parameters to GET /v3/items/walmart/search.
  spec_locations:
  - openapi/_original/walmart-marketplace-items-openapi-original.yml
  note: productIdType enumerations across the item surface accept GTIN/UPC/EAN/ISBN, the GS1 identifier family.
- id: x12-edi
  standard: ANSI X12 EDI
  conforms: false
  category: domain-standard
  market: retail / supply chain
  evidence: No X12 message type, transaction set number or EDI envelope appears anywhere in the 27 published OpenAPI definitions.
    Walmart operates EDI with 1P suppliers through Retail Link, outside this API surface.
  note: Recorded as a checked absence, not a penalty — the Marketplace API programme is deliberately JSON/REST rather than
    EDI.

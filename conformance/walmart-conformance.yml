description: Standards conformance for the Walmart Marketplace, Dropship Vendor and Walmart Fulfillment Services APIs. Walmart
  conforms strongly on the identity and identifier axes — OAuth 2.0 client credentials, RFC 8414/9728 metadata, RFC 7591 dynamic
  client registration and RFC 9116 security.txt, plus GS1 GTIN as a first-class item identifier declared in the contract itself
  — and diverges deliberately on HTTP conventions, shipping proprietary header and error-envelope shapes where an RFC exists
  (WM_SEC.ACCESS_TOKEN instead of Bearer, x-current-token-count instead of RateLimit-*, an errors[] envelope instead of RFC
  9457). No published compliance certifications (SOC 2, ISO 27001, PCI DSS) were found on the developer portal for the API
  programme, so no Compliance claim is made here.

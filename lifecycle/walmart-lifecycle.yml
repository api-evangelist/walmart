description: Walmart publishes a formal Marketplace API deprecation guide defining four lifecycle states — Active, Legacy,
  Deprecated and Sunset — with a support policy for each and a public timetable of every API currently in a non-Active state,
  including its migration path, status date and sunset date. Deprecation status is also communicated through API response
  headers. Versioning is by URI path segment (/v3/, /v4/) plus an item-specification version stream (Spec 4.x -> 5.0) with
  its own dated updates.
versioning:
  scheme: uri-path
  current: v3 (v4 for the newer WFS inbound-shipment surface)
  note: Major version is the first path segment after the host, e.g. /v3/orders. A second version stream governs the Item
    Spec (currently 5.0), published as dated spec-version pages.
  docs: https://developer.walmart.com/us-marketplace/page/item-spec-50-version-update
deprecation_policy:
  published: true
  url: https://developer.walmart.com/us-marketplace/docs/walmart-marketplace-api-deprecation-guide
  states:
  - state: Active
    meaning: Fully supported and recommended; receives enhancements, updates and support.
  - state: Legacy
    meaning: Supported and functional but not recommended for new integrations; no new features. May receive critical security
      and stability fixes.
  - state: Deprecated
    meaning: Scheduled for removal. Remains available for a limited time with a published deprecation date AND sunset date;
      only critical security or stability fixes.
  - state: Sunset
    meaning: Permanently retired after the sunset date. May be disabled or removed; no support, fixes or patches.
  signalling: Deprecation status is published in the documentation and communicated through API response headers.
  rfc8594_sunset_header:
    observed: false
    note: Walmart states deprecation is signalled in response headers but does not name RFC 8594 Sunset/Deprecation headers
      in the guide; not verified on an unauthenticated response because every Marketplace endpoint returns 401 without a seller
      token.

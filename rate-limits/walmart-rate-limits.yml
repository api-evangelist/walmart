sandbox:
  source: https://developer.walmart.com/us-marketplace/docs/sandbox-throttling-limits
  note: Sandbox has its own, much tighter throttling limits; exceeding them also returns 429.
  limits:
  - feed_type: Items
    limit: 30
    window: hour
    max_file_size: 100 KB
    processing_time: 30 mins
  - feed_type: Prices
    limit: 30
    window: hour
    max_file_size: 5 KB
    processing_time: 30 mins
  - feed_type: Promotion
    limit: 30
    window: hour
    max_file_size: 25 KB
    processing_time: 30 mins
  - feed_type: Inventory
    limit: 30
    window: hour
    max_file_size: 2 KB
    processing_time: 30 mins
  - feed_type: Lag Time
    limit: 30
    window: hour
    max_file_size: 2 KB
    processing_time: 30 mins
  - feed_type: Returns/Refunds
    limit: 30
    window: hour
    max_file_size: 2 KB
    processing_time: 30 mins

specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
generated: '2026-08-27'
method: searched
source: https://developer.walmart.com/us-marketplace/docs/rate-limiting
provider: Walmart
providerId: walmart
created: '2026-05-04'
modified: '2026-08-27'
tags:
- Rate Limiting
- Retail / Marketplace
- Marketplace Seller APIs
description: 'Walmart publishes per-operation rate limits for the US Marketplace APIs on its developer portal. Limits
  are enforced with a token-bucket algorithm and are allotted at the SELLER level: a seller with a direct integration
  and each approved Solution Provider application acting on that seller''s behalf receive separate allotments. Exceeding
  a rate limit returns HTTP 429; exceeding a feed file-size limit returns HTTP 413. Every response carries the seller''s
  current token count and the next replenishment time as headers.'
sources:
- https://developer.walmart.com/us-marketplace/docs/rate-limiting
- https://developer.walmart.com/us-marketplace/docs/sandbox-throttling-limits
- https://developer.walmart.com/us-marketplace/docs/api-status-codes-and-errors
docs: https://developer.walmart.com/us-marketplace/docs/rate-limiting
algorithm: token-bucket
allotment: per-seller; direct-integration and each approved Solution Provider application are metered separately
headers:
  remaining: x-current-token-count
  reset: X-Next-Replenishment-Time
  retryAfter: null
header_notes: Walmart does not emit RFC-9331 style RateLimit-* or Retry-After headers; it publishes x-current-token-count
  (tokens left for THIS API) and X-Next-Replenishment-Time (when the bucket refills).
responseCodes:
  throttled: 429
  payloadTooLarge: 413
limit_count: 202

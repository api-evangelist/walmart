- type: Features
  data:
  - Remote MCP server live at https://developer.walmart.com/mcp (OAuth 2.1 + PKCE, scopes openapi_read/offline_access)
  - 202 per-operation rate limits published, token-bucket, allotted per seller; headers x-current-token-count
    + X-Next-Replenishment-Time
  - Formal four-state API deprecation guide (Active/Legacy/Deprecated/Sunset) with published sunset dates
  - Dated changelog, 51 entries, roughly weekly, written at operation and property granularity
  - No idempotency mechanism anywhere in the surface — writes are not replay-safe
  - No maintained first-party SDK; both walmartlabs repos are archived (2019, 2020). Walmart directs developers
    to OpenAPI Generator
  - GS1 GTIN-14 is a first-class item identifier declared in the contract, with a GTIN Exemption API for
    products without one
  - 'No API metering: access follows an approved seller account; referral fees 6-15% by category, no setup
    or monthly fee'
  sources:
  - https://developer.walmart.com/us-marketplace/docs/rate-limiting
  - https://developer.walmart.com/us-marketplace/docs/walmart-marketplace-api-deprecation-guide
  - https://developer.walmart.com/mcp
  - https://marketplace.walmart.com/pricing/

    original document is left untouched; this overlay records the correction.
  update:
  - url: https://marketplace.walmartapis.com
    description: Walmart Marketplace production
  - url: https://sandbox.walmartapis.com
    description: Walmart sandbox
- target: $
  description: Declare the cross-cutting runtime semantics Walmart documents on the portal but does not express in the contract.
  update:
    x-idempotency:
      supported: false
      note: No idempotency key mechanism is documented anywhere on developer.walmart.com.
    x-rate-limit-headers:
      remaining: x-current-token-count
      reset: X-Next-Replenishment-Time
      exhausted_status: 429
      oversized_payload_status: 413
    x-error-envelope:
      format: proprietary
      shape: '{"errors":[{"code","message","category","severity","field"}]}'
      rfc9457: false
    x-required-headers:
    - WM_SEC.ACCESS_TOKEN
    - WM_QOS.CORRELATION_ID
    - WM_SVC.NAME
    x-deprecation-policy: https://developer.walmart.com/us-marketplace/docs/walmart-marketplace-api-deprecation-guide

- name: customerOrderId
  entity: Order
  note: Customer-facing order number; distinct from purchaseOrderId. One customer order can span several purchase orders.
- name: sku
  entity: Item
  note: Seller-assigned stock keeping unit; the seller's own identifier.
- name: gtin
  entity: Item

description: 'Entity-relationship graph derived from $ref links between component schemas across Walmart''s 27 published OpenAPI
  definitions. The Marketplace data core is order-and-item shaped: a purchase order fans out to order lines, each order line
  carries charges, taxes, refunds and status quantities; items carry SKU/GTIN identifiers, price, inventory by ship node,
  and lag time. Feeds are the asynchronous write path and have their own status/ingestion entity family. Identifiers are heterogeneous
  by design — purchaseOrderId, customerOrderId, sku, gtin, itemId, wpid, feedId, returnOrderId, shipmentId — and are not interchangeable
  across surfaces.'

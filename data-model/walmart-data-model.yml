- name: returnOrderId
  entity: ReturnOrder
  note: Primary key for the returns surface.
- name: shipmentId / inboundOrderId
  entity: InboundShipment
  note: WFS inbound shipment identifiers.
- name: subscriptionId
  entity: WebhookSubscription
  note: Notification subscription handle.

api_metered: false
plan_count: 2
plans:
- id: walmart-marketplace-seller
  name: Marketplace Seller
  type: commission
  price: 0
  currency: USD
  billing_period: null
  description: No setup, monthly or subscription fee. API access is included with an approved Marketplace seller account.
  included_quota: Published per-operation rate limits, allotted per seller (see rate-limits/walmart-rate-limits.yml).
  overage: None — limits throttle at 429 rather than billing.
  commission:
    name: Referral fee
    model: percentage of total sales price
    range_min_percent: 6
    range_max_percent: 15
    note: Varies by category and total sales price. Quoted verbatim from marketplace.walmart.com.
  gate: Marketplace seller application and approval.
- id: walmart-solution-provider
  name: Approved Solution Provider
  type: partner
  price: null
  currency: USD
  billing_period: null
  description: Software vendors integrate on behalf of sellers. Requires a signed contract with Walmart and listing in the
    Walmart App Store. Each approved Solution Provider application receives its own rate-limit allotment, separate from the
    seller's direct-integration allotment.
  included_quota: Same published per-operation limits, metered separately per application.
  gate: Channel-partner application (https://marketplace.walmart.com/channel-partner-prospect-form/) plus a signed contract.
  note: Delegated Access keys retired 2026-07-30; providers now use OAuth 2.0 seller authorization via the Walmart App Store.
not_priced:
- item: API calls
  note: No per-call price anywhere in the programme.
- item: Sandbox
  note: Free with an approved account; separate credential pair.
- item: WFS fulfilment and storage
  note: Separate fee schedule, not API-metered.
- item: Walmart Connect advertising
  note: Ad spend, billed through the advertising surface, not the API.

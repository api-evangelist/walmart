description: 'The Walmart Marketplace APIs are not sold as an API product and have no metered API pricing, no per-call charge,
  and no developer tiers. Access is a consequence of a commercial relationship: an approved Marketplace seller account (or
  an approved Solution Provider acting for one), or a 1P Supplier account through Retail Link. Walmart states plainly that
  there are "no setup, monthly, or hidden fees for any sellers" — the seller instead pays a referral fee on each sale, which
  varies by category and total sales price and ranges from 6% to 15%. Walmart Fulfillment Services (WFS) storage and fulfilment
  fees and Walmart Connect advertising spend are separate commercial line items, also not API-metered. A developer therefore
  cannot buy API access at any price without first being approved to sell.'

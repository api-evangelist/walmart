retry_guidance:
  '429': Pause requests for that API, read x-current-token-count and x-next-replenish-time, sleep until replenishment, resume
    at a lower rate. Use a client-side token bucket.
  '423': Retry after a short delay; if it recurs for an hour, reduce concurrency.
  '500': Retry with exponential backoff and jitter after confirming Content-Type matches the payload.
  '503': Wait briefly and retry; contact Support with examples if the outage persists.
  '504': Retry with exponential backoff.

format_note: 'Walmart does NOT use RFC 9457 application/problem+json. Marketplace APIs return an ARRAY error envelope in application/json:
  {"errors":[{"code","message","category","severity","field"}]}. Older/gateway surfaces return the same shape under the singular
  key "error" with fields code/field/description/info/severity/category, and the gateway can answer application/xml (<_InternalGMPErrorWrapper>)
  when it rejects a call before routing. Clients must handle all three.'
envelope:
  json_current: '{"errors":[{"code":"INVALID_REQUEST_PARAM","message":"...","category":"DATA","severity":"ERROR","field":"sku"}]}'
  json_gateway: '{"error":[{"code":"UNAUTHORIZED.GMP_GATEWAY_API","field":"UNAUTHORIZED","description":"Unauthorized","info":"..."}]}'
  xml_gateway: <_InternalGMPErrorWrapper>...</_InternalGMPErrorWrapper>
  fields:
  - code
  - message | description
  - category
  - severity
  - field
  - info
  correlation: Send WM_QOS.CORRELATION_ID (a UUID) on every request; quote it in support tickets.
description: Walmart publishes a consolidated Marketplace API error reference covering standard HTTP-mapped error codes, authentication
  failures, rate-limit behaviour, per-scenario troubleshooting for orders/items/price/inventory, and feed validation error
  codes. The OpenAPI definitions themselves document very few 4xx/5xx responses (7 across 171 operations), so the docs are
  the authoritative error contract, not the spec.

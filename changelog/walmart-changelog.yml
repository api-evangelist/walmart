  apis:
  - Insights
  change_types:
  - Added
  highlights:
  - Added optional query parameter conditionType to GET /v3/insights/performance/returns/report and /summary
  - Added optional response property payload/conditionType on the returns summary 200
  breaking: false
- version: july-30-2026-release
  date: '2026-07-30'
  url: https://developer.walmart.com/us-marketplace/changelog/july-30-2026-release
  apis:
  - Items
  - Bulk Item Setup
  - Feeds
  - On-request Reports
  - Orders
  - Insights
  change_types:
  - Added
  - Changed
  highlights:
  - Virtual pack support added across POST /v3/items/spec, GET /v3/items, GET /v3/items/{id} and the MP_VIRTUAL_PACK_BUNDLE
    feed type
  - Orders miscAttributes changed from object to oneOf with a discriminator, and required properties details and name were
    REMOVED — a response-shape change across all seven order operations
  - Added optional query parameters inDemandIndicator and isCustomerFavorite on Insights
  breaking: false
  note: The Orders miscAttributes change removes previously-required properties and introduces a discriminator; strict client
    deserializers may need updating even though Walmart classifies it as Added/Changed rather than breaking.

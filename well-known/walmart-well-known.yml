description: Walmart serves two real /.well-known documents. The developer portal (developer.walmart.com,
  a ReadMe-hosted site) publishes RFC 8414 OAuth authorization-server metadata and RFC 9728 OAuth protected-resource
  metadata — these describe the OAuth guard in front of the portal's own remote MCP server (scopes openapi_read
  + offline_access), not the Marketplace seller APIs. www.walmart.com serves an RFC 9116 security.txt
  whose canonical is walmart.com. Every Marketplace API host (marketplace.walmartapis.com, sandbox.walmartapis.com,
  api-gateway.walmart.com) answers 401 to every path because the gateway requires a seller token before
  routing anything, including /.well-known.

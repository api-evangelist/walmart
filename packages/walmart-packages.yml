  published to NuGet or npm under a Walmart-owned account. Walmart''s current position is code generation: its own docs point
  developers at OpenAPI Generator to build a typed client from the published spec, and the MCS Java OpenAPI Client Integration
  Guide (February 2026) is a step-by-step generator recipe rather than a shipped library. Every installable Walmart client
  on a registry today is third-party, and the most-used one has not shipped since 2022.'
